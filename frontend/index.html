<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuminaCut AI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>LuminaCut AI</h1>
      <p>Edit videos with natural language instructions in a fully offline-friendly stack.</p>
    </header>

    <main class="layout">
      <section class="card" id="upload-card">
        <h2>New Project</h2>
        <form id="upload-form">
          <label class="field">
            <span>Project name</span>
            <input type="text" name="name" placeholder="Untitled Project" />
          </label>
          <label class="field">
            <span>Video file</span>
            <input type="file" name="file" accept="video/*" required />
          </label>
          <button type="submit">Upload</button>
        </form>
        <p class="hint">Supported formats depend on your browser since processing is simulated.</p>
      </section>

      <section class="card" id="projects-card">
        <h2>Projects</h2>
        <ul id="projects-list" class="projects"></ul>
      </section>

      <section class="card" id="editor-card">
        <h2 id="editor-title">Editor</h2>
        <div class="editor-grid">
          <div>
            <video id="preview" controls class="preview" preload="metadata"></video>
            <div class="toolbar">
              <button id="refresh-preview" disabled>Refresh preview</button>
              <button id="export-mp4" disabled>Export MP4</button>
              <button id="export-mov" disabled>Export MOV</button>
            </div>
          </div>
          <div>
            <label class="field">
              <span>Instruction</span>
              <textarea id="instruction-input" rows="5" placeholder="Describe how to edit the video..."></textarea>
            </label>
            <label class="inline">
              <input type="checkbox" id="preview-toggle" checked />
              <span>Generate preview after applying instruction</span>
            </label>
            <button id="apply-instruction" disabled>Apply instruction</button>
            <div id="status" class="status"></div>
            <h3>Operation history</h3>
            <ul id="operations" class="operations"></ul>
          </div>
        </div>
      </section>
    </main>

    <template id="project-item-template">
      <li class="project">
        <button data-action="select"></button>
        <span class="status-pill"></span>
      </li>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
